name: Supabase Release

# Release branches (release/YY.MM.DD) drive Supabase deploys instead of main:
#   - PRs opened against a release/* branch run migrations against the dev project as a pre-merge check.
#   - Pushes to a release/* branch (i.e. the release branch itself moving forward) deploy to production.
on:
  pull_request:
    branches: ["release/**"]
    paths:
      - "supabase/migrations/**"
  push:
    branches: ["release/**"]
    paths:
      - "supabase/functions/parse-email/**"
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      function: ${{ steps.filter.outputs.function }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            function:
              - 'supabase/functions/parse-email/**'
            migrations:
              - 'supabase/migrations/**'

  migrate-dev:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: supabase-dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard against dev pointing at the production project
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ "$SUPABASE_PROJECT_ID" = "qqxhqcbbgmzylwkxfhbr" ]; then
            echo "::error::supabase-dev's SUPABASE_PROJECT_ID is the production project ref. Refusing to run db push."
            exit 1
          fi

      - name: Link dev project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push migrations
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

  deploy-prod:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (needs.changes.outputs.function == 'true' || needs.changes.outputs.migrations == 'true')))
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Verify secrets (manual dispatch only, no schema changes)
        if: github.event_name == 'workflow_dispatch'
        run: supabase db push --dry-run --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push migrations
        if: github.event_name == 'push' && needs.changes.outputs.migrations == 'true'
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Deploy parse-email function
        if: github.event_name == 'push' && needs.changes.outputs.function == 'true'
        run: supabase functions deploy parse-email --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
