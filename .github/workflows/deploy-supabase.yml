name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/parse-email/**"
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      function: ${{ steps.filter.outputs.function }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            function:
              - 'supabase/functions/parse-email/**'
            migrations:
              - 'supabase/migrations/**'

  deploy:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.function == 'true' ||
      needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Verify secrets (manual dispatch only, no schema changes)
        if: github.event_name == 'workflow_dispatch'
        run: supabase db push --dry-run --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push migrations
        if: github.event_name == 'push' && needs.changes.outputs.migrations == 'true'
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Deploy parse-email function
        if: github.event_name == 'push' && needs.changes.outputs.function == 'true'
        run: supabase functions deploy parse-email --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
